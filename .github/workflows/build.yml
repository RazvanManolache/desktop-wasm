name: Browser demo build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: windows-2022
    timeout-minutes: 60
    outputs:
      pages_artifact_id: ${{ steps.pages-upload.outputs.artifact_id }}
    steps:
    - name: Enable long source paths on Windows
      run: git config --global core.longpaths true
    - uses: actions/checkout@v7.0.1
    - uses: actions/setup-dotnet@v6.1.0
      with:
        dotnet-version: '9.0.x'
    - uses: actions/setup-python@v7
      with:
        python-version: '3.14'
    - name: Install browser build and test tools
      run: |
        dotnet workload install wasm-tools --skip-manifest-update
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        python -m pip install --upgrade pip
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        python -m pip install playwright==1.64.0 Pillow==12.0.0
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        python -m playwright install chromium
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
    - name: Build, test, package and render browser demo
      run: ./scripts/ci/build.ps1
    - uses: actions/github-script@v9
      with:
        script: |
          const publish = require('./.github/scripts/publish-build.cjs');
          await publish({github, context, core, glob, exec});
      env:
        BUILD_NAME: DesktopWasm-browser-demos
        BUILD_PATHS: .ci-dist/downloads/*
        BUILD_HIDDEN: 'true'
        BUILD_MISSING: error
      if: (success()) && success() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
    - name: Upload build and test evidence
      if: (always() && hashFiles('.ci-results/**') != '') && success() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
      uses: actions/github-script@v9
      with:
        script: |
          const publish = require('./.github/scripts/publish-build.cjs');
          await publish({github, context, core, glob, exec});
      env:
        BUILD_NAME: DesktopWasm-build-reports
        BUILD_PATHS: .ci-results/
        BUILD_HIDDEN: 'true'
        BUILD_MISSING: error
    - name: Configure GitHub Pages
      if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
      uses: actions/configure-pages@v5
    - name: Upload temporary Pages deployment
      id: pages-upload
      if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
      uses: actions/upload-pages-artifact@v4
      with:
        path: .ci-dist/pages
        retention-days: 1
    permissions:
      contents: write
      pages: read
  pages:
    needs: browser
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write
    steps:
    - name: Deploy showcase
      id: deployment
      uses: actions/deploy-pages@v4
    - name: Remove completed deployment artifact
      uses: actions/github-script@v9
      env:
        PAGES_ARTIFACT_ID: ${{ needs.browser.outputs.pages_artifact_id }}
      with:
        script: |
          await github.rest.actions.deleteArtifact({
            ...context.repo,
            artifact_id: Number(process.env.PAGES_ARTIFACT_ID)
          });
